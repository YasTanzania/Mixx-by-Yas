<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiber Smart System</title>

<style>
body {
margin:0;
font-family:Arial;
background:#f5f5f5;
}

/* CENTER */
.container {
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* BOX */
.box {
background:yellow;
color:blue;
padding:25px;
border-radius:12px;
width:90%;
max-width:360px;
text-align:center;
animation:fade 0.5s;
}

/* INPUT */
input {
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
}

/* BUTTON */
button {
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:blue;
color:white;
font-weight:bold;
cursor:pointer;
}

/* OPTIONS */
.option {
background:#111;
color:white;
margin-top:10px;
padding:12px;
border-radius:8px;
cursor:pointer;
}

/* ANIMATION */
@keyframes fade {
from {opacity:0; transform:translateY(20px);}
to {opacity:1; transform:translateY(0);}
}
</style>

</head>

<body>

<div class="container">
<div class="box" id="app">

<h3>Huduma ya Fiber</h3>

<input type="text" id="name" placeholder="Majina kamili">

<button onclick="step1()">ENDELEA</button>

<p id="msg"></p>

</div>
</div>

<script>

/* VARIABLES */
let name="", phone="", location="", huduma="";

/* HELPER */
function setContent(c){
document.getElementById("app").innerHTML = c;
}

/* STEP 1 - NAME */
function step1(){

let input = document.getElementById("name");

if(!input){
alert("Error imejitokeza");
return;
}

name = input.value.trim();

if(name === ""){
document.getElementById("msg").innerHTML="⚠️ Weka majina kamili";
return;
}

setContent("⏳ Inachakata taarifa...");
setTimeout(step2,1500);
}

/* STEP 2 - PHONE */
function step2(){
setContent(`
<h3>Weka Namba</h3>
<input type="number" id="phone" placeholder="Namba yako ya Fiber/YAS">
<button onclick="step3()">ENDELEA</button>
`);
}

/* STEP 3 */
function step3(){

let input = document.getElementById("phone");
phone = input.value.trim();

if(phone === ""){
alert("⚠️ Weka namba yako");
return;
}

setContent("⏳ Inachakata namba...");
setTimeout(step4,1500);
}

/* STEP 4 - LOCATION */
function step4(){
setContent(`
<h3>Eneo lako</h3>
<input type="text" id="location" placeholder="Mfano: Dar, Arusha">
<button onclick="step5()">ENDELEA</button>
`);
}

/* STEP 5 */
function step5(){

let input = document.getElementById("location");
location = input.value.trim();

if(location === ""){
alert("⚠️ Weka eneo lako");
return;
}

setContent("⏳ Inatafuta huduma eneo lako...");
setTimeout(step6,1500);
}

/* STEP 6 - CHOICE */
function step6(){
setContent(`
<h3>Chagua Huduma</h3>

<div class="option" onclick="selectOption('Nahitaji Fiber')">
📡 Nahitaji Fiber yangu
</div>

<div class="option" onclick="selectOption('Nina tatizo')">
⚠️ Nina tatizo la huduma
</div>
`);
}

/* STEP 7 */
function selectOption(choice){
huduma = choice;

setContent("⏳ Inakuunganisha na mfumo...");
setTimeout(finish,1500);
}

/* FINAL */
function finish(){

let msg =
"MTEJA MPYA%0A"+
"Jina: "+name+"%0A"+
"Namba: "+phone+"%0A"+
"Eneo: "+location+"%0A"+
"Mahitaji: "+huduma;

let link = "https://wa.me/255780467038?text="+msg; // BADILISHA NAMBA

setContent(`
<h3 style="color:green;">✔ Imekamilika</h3>
<p>Endelea kupata huduma yako</p>

<button onclick="window.location.href='${link}'">
POKEA MENU YAKO
</button>
`);
}

</script>

</body>
</html>
