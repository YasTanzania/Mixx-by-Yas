<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiber System</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:yellow;
color:blue;
padding:25px;
border-radius:12px;
width:90%;
max-width:350px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:blue;
color:white;
font-weight:bold;
cursor:pointer;
}

.option{
background:#111;
color:white;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box" id="app"></div>

<script>

let name="", phone="", location="", huduma="";

/* LOAD FIRST SCREEN */
start();

function start(){
document.getElementById("app").innerHTML=`
<h3>Huduma ya Fiber</h3>
<input id="name" placeholder="Majina kamili">
<button id="next1">ENDELEA</button>
<p id="msg"></p>
`;

document.getElementById("next1").addEventListener("click", step1);
}

/* STEP 1 */
function step1(){
let input=document.getElementById("name");

if(!input.value.trim()){
document.getElementById("msg").innerHTML="⚠️ Weka majina";
return;
}

name=input.value;

setContent("⏳ Inachakata taarifa...");
setTimeout(step2,1500);
}

/* STEP 2 */
function step2(){
setContent(`
<h3>Weka Namba</h3>
<input id="phone" placeholder="Namba yako">
<button id="next2">ENDELEA</button>
`);

document.getElementById("next2").addEventListener("click", step3);
}

/* STEP 3 */
function step3(){
let input=document.getElementById("phone");

if(!input.value.trim()){
alert("Weka namba");
return;
}

phone=input.value;

setContent("⏳ Inachakata namba...");
setTimeout(step4,1500);
}

/* STEP 4 */
function step4(){
setContent(`
<h3>Eneo lako</h3>
<input id="location" placeholder="Mfano: Dar">
<button id="next3">ENDELEA</button>
`);

document.getElementById("next3").addEventListener("click", step5);
}

/* STEP 5 */
function step5(){
let input=document.getElementById("location");

if(!input.value.trim()){
alert("Weka eneo");
return;
}

location=input.value;

setContent("⏳ Inatafuta huduma...");
setTimeout(step6,1500);
}

/* STEP 6 */
function step6(){
setContent(`
<h3>Chagua Huduma</h3>

<div class="option" id="fiber">📡 Nahitaji Fiber</div>
<div class="option" id="tatizo">⚠️ Nina tatizo</div>
`);

document.getElementById("fiber").addEventListener("click", ()=>select("Nahitaji Fiber"));
document.getElementById("tatizo").addEventListener("click", ()=>select("Nina tatizo"));
}

/* STEP 7 */
function select(choice){
huduma=choice;

setContent("⏳ Inakuunganisha...");
setTimeout(finish,1500);
}

/* FINAL */
function finish(){

let msg=
"MTEJA MPYA%0A"+
"Jina: "+name+"%0A"+
"Namba: "+phone+"%0A"+
"Eneo: "+location+"%0A"+
"Mahitaji: "+huduma;

let link="https://wa.me/255712345678?text="+msg;

setContent(`
<h3 style="color:green;">✔ Imekamilika</h3>
<p>Bonyeza kuendelea</p>
<button id="wa">POKEA MENU YAKO</button>
`);

document.getElementById("wa").addEventListener("click", ()=>{
window.location.href=link;
});
}

/* HELPER */
function setContent(c){
document.getElementById("app").innerHTML=c;
}

</script>

</body>
</html>
