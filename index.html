<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiber Mixx System</title>

<style>
body {margin:0;font-family:Arial;background:#f5f5f5;}

.container {
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box {
background:yellow;
color:blue;
padding:25px;
border-radius:12px;
width:90%;
max-width:350px;
text-align:center;
animation:fade 0.6s;
}

input {
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
}

button {
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:blue;
color:white;
font-weight:bold;
cursor:pointer;
}

.option {
background:#111;
color:white;
margin-top:10px;
padding:12px;
border-radius:8px;
cursor:pointer;
}

@keyframes fade {
from {opacity:0; transform:translateY(20px);}
to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">
<div class="box" id="app">

<h3>Huduma ya Fiber</h3>

<input type="text" id="name" placeholder="Majina kamili">
<button onclick="step1()">ENDELEA</button>

<p id="msg"></p>

</div>
</div>

<script>
let name="", phone="", location="", huduma="";

/* STEP 1 - NAME */
function step1(){
name=document.getElementById("name").value;

if(name==""){
document.getElementById("msg").innerHTML="⚠️ Weka majina";
return;
}

setContent("⏳ Inachakata taarifa...");
setTimeout(step2,1500);
}

/* STEP 2 - PHONE */
function step2(){
setContent(`
<h3>Weka Namba</h3>
<input type="number" id="phone" placeholder="Namba yako ya Fiber/YAS">
<button onclick="step3()">ENDELEA</button>
`);
}

/* STEP 3 */
function step3(){
phone=document.getElementById("phone").value;

if(phone==""){
alert("Weka namba");
return;
}

setContent("⏳ Inachakata namba...");
setTimeout(step4,1500);
}

/* STEP 4 - LOCATION */
function step4(){
setContent(`
<h3>Eneo lako</h3>
<input type="text" id="location" placeholder="Mfano: Dar, Arusha">
<button onclick="step5()">ENDELEA</button>
`);
}

/* STEP 5 */
function step5(){
location=document.getElementById("location").value;

if(location==""){
alert("Weka eneo");
return;
}

setContent("⏳ Inatafuta huduma eneo lako...");
setTimeout(step6,1500);
}

/* STEP 6 - CHOICE */
function step6(){
setContent(`
<h3>Chagua Huduma</h3>

<div class="option" onclick="select('Nahitaji Fiber')">
📡 Nahitaji Fiber yangu
</div>

<div class="option" onclick="select('Nina tatizo')">
⚠️ Nina tatizo la huduma
</div>
`);
}

/* STEP 7 */
function select(choice){
huduma=choice;

setContent("⏳ Inakuunganisha na mfumo...");
setTimeout(finish,1500);
}

/* FINAL */
function finish(){

let message=
"MTEJA MPYA%0A"+
"Jina: "+name+"%0A"+
"Namba: "+phone+"%0A"+
"Eneo: "+location+"%0A"+
"Mahitaji: "+huduma;

let link="https://wa.me/255780467038?text="+message;

setContent(`
<p style="color:green;">✔ Mfumo uko tayari</p>
<p>Bonyeza hapa kupata huduma yako</p>

<button onclick="window.location.href='${link}'">
POKEA HUDUMA SASA
</button>
`);
}

/* HELPER */
function setContent(c){
document.getElementById("app").innerHTML=c;
}
</script>

</body>
</html>
