<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixx by Yas</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

.hero {
    height: 100vh;
    background: url('poster.jpg') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

.overlay {
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    color: white;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: yellow;
    border: none;
    font-weight: bold;
    border-radius: 8px;
}
</style>

</head>

<body>

<div class="hero">
    <div class="overlay">
        <h1>75GB kwa Tsh 3,999</h1>
        <p>Bila kikomo – Jiunge sasa!</p>

        <input type="text" id="name" placeholder="Jina lako">
        <input type="tel" id="phone" placeholder="Namba yako">

        <button onclick="sendData()">JIUNGE SASA</button>
    </div>
</div>

<script>
function sendData() {
    var name = document.getElementById("name").value;
    var phone = document.getElementById("phone").value;

    var message = "Nataka kujiunga na ofa ya 75GB.%0AJina: " + name + "%0ANamba: " + phone;

    window.open("https://wa.me/255780467038?text=" + message);
}
</script>

</body>
</html>
