<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiber Smart System</title>

<style>
body {
margin:0;
font-family:Arial;
background:url('poster.jpg') no-repeat center;
background-size:cover;
}

.overlay {
background:rgba(0,0,0,0.6);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box {
background:yellow;
color:blue;
padding:25px;
border-radius:12px;
width:90%;
max-width:360px;
text-align:center;
animation:fade 0.5s;
}

input {
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
}

button {
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:blue;
color:white;
font-weight:bold;
cursor:pointer;
}

.option {
background:#111;
color:white;
margin-top:10px;
padding:12px;
border-radius:8px;
cursor:pointer;
}

.topbar {
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:14px;
text-align:center;
}

@keyframes fade {
from {opacity:0; transform:translateY(20px);}
to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="topbar">
🔥 Watu <span id="users">17</span> wanaendelea sasa hivi<br>
⏳ Dakika <span id="time">17:00</span> zimebaki
</div>

<div class="overlay">
<div class="box" id="app">

<h3>Jiunge na Fiber sasa</h3>

<input type="text" id="name" placeholder="Majina kamili">
<button onclick="step1()">ENDELEA</button>

</div>
</div>

<script>
let name="", phone="", location="", huduma="";

/* LIVE USERS */
setInterval(()=>{
let num = Math.floor(Math.random()*10)+10;
document.getElementById("users").innerText=num;
},3000);

/* TIMER */
let time=17*60;
setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
document.getElementById("time").innerText=
m+":"+(s<10?"0"+s:s);
if(time>0) time--;
},1000);

/* STEP 1 */
function step1(){
name=document.getElementById("name").value;
if(name==""){alert("Weka majina");return;}
setContent("⏳ Inachakata taarifa...");
setTimeout(step2,1500);
}

/* STEP 2 */
function step2(){
setContent(`
<h3>Weka Namba</h3>
<input type="number" id="phone" placeholder="Namba yako">
<button onclick="step3()">ENDELEA</button>
`);
}

/* STEP 3 */
function step3(){
phone=document.getElementById("phone").value;
if(phone==""){alert("Weka namba");return;}
setContent("⏳ Inachakata namba...");
setTimeout(step4,1500);
}

/* STEP 4 */
function step4(){
setContent(`
<h3>Eneo lako</h3>
<input type="text" id="location" placeholder="Mfano: Dar, Arusha">
<button onclick="step5()">ENDELEA</button>
`);
}

/* STEP 5 */
function step5(){
location=document.getElementById("location").value;
if(location==""){alert("Weka eneo");return;}
setContent("⏳ Inatafuta huduma eneo lako...");
setTimeout(step6,1500);
}

/* STEP 6 */
function step6(){
setContent(`
<h3>Chagua Huduma</h3>

<div class="option" onclick="select('Nahitaji Fiber')">
📡 Nahitaji Fiber
</div>

<div class="option" onclick="select('Nina tatizo')">
⚠️ Nina tatizo
</div>
`);
}

/* STEP 7 */
function select(choice){
huduma=choice;
setContent("⏳ Inakuunganisha...");
setTimeout(finish,1500);
}

/* FINAL */
function finish(){

let msg=
"MTEJA MPYA%0A"+
"Jina: "+name+"%0A"+
"Namba: "+phone+"%0A"+
"Eneo: "+location+"%0A"+
"Mahitaji: "+huduma;

let link="https://wa.me/255712345678?text="+msg;

setContent(`
<h3 style="color:green;">✔ Imekamilika</h3>
<p>Bonyeza kupokea huduma yako</p>

<button onclick="window.location.href='${link}'">
POKEA MENU YAKO
</button>
`);
}

/* HELPER */
function setContent(c){
document.getElementById("app").innerHTML=c;
}
</script>

</body>
</html>
