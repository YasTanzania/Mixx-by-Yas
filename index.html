<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixx by Yas</title>

<style>
body{
  margin:0;
  font-family: Arial;
}

/* BACKGROUND IMAGE */
.hero{
  background: url('poster.jpg') no-repeat center;
  background-size: cover;
  height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DARK OVERLAY */
.overlay{
  background: rgba(0,0,0,0.7);
  padding:30px;
  border-radius:15px;
  text-align:center;
  width:300px;
}

/* TEXT */
h1{
  color:#fff;
  font-size:22px;
}

p{
  color:#ccc;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

/* BUTTON */
.btn{
  background:yellow;
  padding:12px;
  border-radius:8px;
  color:black;
  font-weight:bold;
  cursor:pointer;
  display:block;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="hero">
  <div class="overlay">
    <h1>75GB kwa Tsh 3,999</h1>
    <p>Bila kikomo – Jiunge sasa!</p>

    <input type="text" placeholder="Jina lako">
    <input type="number" placeholder="Namba yako">

    <a href="#" class="btn">JIUNGE SASA</a>
  </div>
</div>

</body>
</html>
